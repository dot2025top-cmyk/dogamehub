<html lang="en">
<head>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    color: white;
    min-height: 100vh;
}

header {
    padding: 20px;
    background: #101a2b;
    border-bottom: 1px solid #263650;
    display: flex;

    align-items: center;
}

.logo {

    color: #39e6a5;
}

.back {
    color: white;

    font-size: 14px;
}

.container {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 34px;

.generator {

    border: 1px solid #293c59;

}

label {
    display: block;
    margin: 20px 0 9px;
    font-weight: bold;
    font-size: 14px;
}

textarea, select, input {
    width: 100%;

    border: 1px solid #344965;

    color: white;
    outline: none;
    font-size: 15px;
}

textarea {
    min-height: 125px;
    resize: vertical;
}

textarea:focus, select:focus {
    border-color: #39e6a5;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

    margin-top: 28px;
    padding: 16px;

    color: #07140f;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.generate-btn:hover {
    background: #22c98c;
}
